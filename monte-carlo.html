<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monte Carlo Simulation - VALERI Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .mc-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: end;
        }
        .mc-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .mc-metric-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        .mc-metric-card h4 {
            font-size: 0.8rem !important;
            height: auto !important;
            margin-bottom: 0.5rem !important;
            justify-content: center;
            color: var(--text-muted);
        }
        .mc-metric-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mc-metric-value.positive { color: #4ade80; }
        .mc-metric-value.negative { color: #f87171; }
        
        .chart-container-mc {
            position: relative;
            height: 400px;
            width: 100%;
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header style="text-align: center; position: relative;">
            <button class="btn-secondary" onclick="window.location.href='index.html'" style="position: absolute; left: 0; top: 0;">&larr; Zurück</button>
            <h1>Monte Carlo Simulation</h1>
            <p class="subtitle">Probabilistische NPV-Analyse via iterativer Szenarien (MVP)</p>
        </header>

        <section class="glass-card full-width">
            <h2>Simulationseinstellungen</h2>
            <div class="mc-controls">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Iterationen</label>
                    <select id="mc-iterations" style="width: 100%; padding: 0.8rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-main);">
                        <option value="1000">1.000</option>
                        <option value="2000">2.000</option>
                        <option value="3000">3.000</option>
                        <option value="5000" selected>5.000</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Seed (Reproduzierbarkeit)</label>
                    <input type="number" id="mc-seed" value="42" step="1" title="Zufalls-Seed für reproduzierbare Ergebnisse">
                </div>
                <button class="btn-primary" onclick="runMonteCarlo()" style="background: linear-gradient(135deg, #10b981, #059669);">▶ Starten</button>
            </div>
            
            <hr style="border-color: var(--glass-border); margin: 2rem 0;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <h2 style="margin: 0;">Ergebnisse (Kapitalwerte)</h2>
                <button class="btn-secondary" onclick="exportMCCSV()" style="flex: none; width: auto; padding: 0.5rem 1.5rem;">💾 Export CSV</button>
            </div>

            <div class="mc-metrics-grid" id="mc-metrics">
                <!-- Populated by JS -->
            </div>

            <div class="chart-container-mc">
                <canvas id="mcChart"></canvas>
            </div>
        </section>
    </main>
    <script src="monte-carlo.js"></script>
</body>
</html>
